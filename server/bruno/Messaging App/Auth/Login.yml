info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: '{{API_URL}}/api/auth/login'
  body:
    type: json
    data: |-
      {
        "email": "carlos@gmail.com",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        test("logs in and returns the authenticated user", function () {
          expect(res.getStatus()).to.equal(200)
          expect(body.user).to.have.property("id")
          expect(body.user).to.have.property("email", "carlos@gmail.com")
          bru.setVar("authenticatedUserId", body.user.id)
          bru.setVar("authenticatedUserEmail", body.user.email)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
