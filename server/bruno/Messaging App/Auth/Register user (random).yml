info:
  name: Register user (random)
  type: http
  seq: 4

http:
  method: POST
  url: "{{API_URL}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{$randomEmail}}",
        "username": "{{$randomUserName}}",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        test("registers a new user and starts a session", function () {
          expect(res.getStatus()).to.equal(201)
          expect(body.user).to.have.property("id")
          expect(body.user).to.have.property("email")
          expect(body.user).to.have.property("username")
          bru.setVar("authenticatedUserId", body.user.id)
          bru.setVar("authenticatedUserEmail", body.user.email)
          bru.setVar("userEmail", body.user.email)
          bru.setVar("userUsername", body.user.username)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
