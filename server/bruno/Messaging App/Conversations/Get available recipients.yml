info:
  name: Get available recipients
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/api/users"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        test("returns users that can start a conversation", function () {
          expect(res.getStatus()).to.equal(200)
          expect(body.users).to.be.an("array").that.is.not.empty
          expect(body.users[0]).to.have.property("id")
          bru.setVar("conversationRecipientId", body.users[0].id)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
