info:
  name: Reject conversation with self
  type: http
  seq: 7

http:
  method: POST
  url: '{{API_URL}}/api/conversations'
  body:
    type: json
    data: |-
      {
        "userId": "{{conversationCurrentUserId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("rejects starting a conversation with yourself", function () {
          expect(res.getStatus()).to.equal(400)
          expect(res.getBody()).to.have.property("error")
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
