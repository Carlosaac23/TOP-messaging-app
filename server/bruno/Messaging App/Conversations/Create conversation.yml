info:
  name: Create conversation
  type: http
  seq: 3

http:
  method: POST
  url: '{{API_URL}}/api/conversations'
  body:
    type: json
    data: |-
      {
        "userId": "{{conversationRecipientId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        test("creates a conversation or returns the existing one", function () {
          expect([200, 201]).to.include(res.getStatus())
          expect(body.conversation).to.have.property("id")
          bru.setVar("conversationId", body.conversation.id)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
