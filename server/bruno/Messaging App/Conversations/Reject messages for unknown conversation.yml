info:
  name: Reject messages for unknown conversation
  type: http
  seq: 10

http:
  method: GET
  url: '{{API_URL}}/api/conversations/missing-conversation-id/messages'
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("returns not found for a conversation the user cannot access", function () {
          expect(res.getStatus()).to.equal(404)
          expect(res.getBody()).to.have.property("error")
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
