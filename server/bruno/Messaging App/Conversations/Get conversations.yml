info:
  name: Get conversations
  type: http
  seq: 4

http:
  method: GET
  url: "{{API_URL}}/api/conversations"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        test("lists conversations for the authenticated user", function () {
          expect(res.getStatus()).to.equal(200)
          expect(body.conversations).to.be.an("array")
          expect(body.conversations.some(item => item.id === bru.getVar("conversationId"))).to.equal(true)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
