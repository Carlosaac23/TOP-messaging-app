info:
  name: Get users
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/api/users"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()

        test("returns a list of users without the current user", function () {
          expect(res.getStatus()).to.equal(200)
          expect(body.users).to.be.an("array")
          expect(bru.getVar("authenticatedUserId")).to.be.a("string")
          expect(body.users.some(user => user.id === bru.getVar("authenticatedUserId"))).to.equal(false)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
