info:
  name: Get user by username/displayName
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_URL}}/api/users"
  params:
    - name: search
      value: "{{otherUsername}}"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()
        const searchTerm = bru.getVar("otherUsername")?.toLowerCase()

        test("finds another user by username or display name", function () {
          expect(res.getStatus()).to.equal(200)
          expect(body.users).to.be.an("array")
          expect(body.users.some(user =>
            user.username.toLowerCase().includes(searchTerm) ||
            user.displayName.toLowerCase().includes(searchTerm)
          )).to.equal(true)
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
